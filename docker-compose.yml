version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jobconnect-db
    environment:
      MYSQL_DATABASE: jobconnect_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jobconnect-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./jobconnect-backend
      dockerfile: Dockerfile
    container_name: jobconnect-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jobconnect_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-security
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jobconnect-network
    restart: unless-stopped

  frontend:
    build:
      context: ./jobconnect-frontend
      dockerfile: Dockerfile
    container_name: jobconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jobconnect-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  jobconnect-network:
    driver: bridge
