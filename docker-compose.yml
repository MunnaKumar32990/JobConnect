version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobconnect-db
    environment:
      POSTGRES_DB: jobconnect_db
      POSTGRES_USER: jobconnect
      POSTGRES_PASSWORD: jobconnect123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./jobconnect-backend
      dockerfile: Dockerfile
    container_name: jobconnect-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jobconnect_db
      SPRING_DATASOURCE_USERNAME: jobconnect
      SPRING_DATASOURCE_PASSWORD: jobconnect123
      JWT_SECRET: your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-security
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobconnect-network
    restart: unless-stopped

  frontend:
    build:
      context: ./jobconnect-frontend
      dockerfile: Dockerfile
    container_name: jobconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jobconnect-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  jobconnect-network:
    driver: bridge
